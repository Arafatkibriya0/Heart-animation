<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d0d0d;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .heart {
            width: 100px;
            height: 100px;
            background-color: #e23b6c;
            position: relative;
            transform: rotate(-45deg);
            margin: 0 auto;
            animation: beat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 100px;
            height: 100px;
            background-color: #e23b6c;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        @keyframes beat {
            0% { transform: rotate(-45deg) scale(0.9); }
            15% { transform: rotate(-45deg) scale(1.15); }
            30% { transform: rotate(-45deg) scale(0.9); }
            45% { transform: rotate(-45deg) scale(1.1); }
            60% { transform: rotate(-45deg) scale(0.95); }
            100% { transform: rotate(-45deg) scale(0.9); }
        }

        .text {
            margin-top: 40px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .footer-name {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.9rem;
            font-weight: lighter;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart"></div>
        <div class="text">I Dread To You</div>
    </div>
    <div class="footer-name">Arif Hassan</div>
</body>
</html>
